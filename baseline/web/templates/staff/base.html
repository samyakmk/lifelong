{% extends "base.html" %}
{% block navigation %}
  {% if g.staff %}
    <nav class="staff-nav" aria-label="Staff">
      <a class="text-link" href="{{ url_for('staff.index') }}">Fulfillment queue</a>
    </nav>
  {% endif %}
{% endblock %}
{% block header_actions %}
  {% if g.staff %}
    <form method="post" action="{{ url_for('staff.sign_out') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="button button-outline button-small" type="submit">Sign out</button>
    </form>
  {% else %}
    <a class="header-sign-in" href="{{ url_for('web.member') }}">Member sign-in</a>
  {% endif %}
{% endblock %}
